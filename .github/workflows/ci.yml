# Required pull-request gates. Their stable job names intentionally match the
# Skynet-Ventures repository protection contract.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate pinned Hermes authority manifest
        run: python3 scripts/check_hermes_upstream.py

      - name: Toolchain info
        run: xcodebuild -version && swift --version

      - name: swift build
        working-directory: Packages/Talaria
        run: swift build

      - name: Swift tests
        working-directory: Packages/Talaria
        run: swift test

      - name: Protocol checks
        working-directory: Packages/Talaria
        run: swift run talaria-verify

  release-gates:
    name: release-gates
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        working-directory: ios
        run: |
          xcodebuild build \
            -project Talaria.xcodeproj \
            -scheme Talaria \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  optional-privacy:
    name: optional-privacy
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Multi-gateway source isolation is Talaria's privacy boundary: a short
      # Hermes runtime id may collide across machines, but messages and
      # approvals must never cross that boundary.
      - name: Source-qualified isolation regressions
        working-directory: Packages/Talaria
        run: swift test --filter SourceQualifiedRoutingTests
