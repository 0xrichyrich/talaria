name: talaria-push
version: 0.1.0
description: >-
  APNs push relay for the Talaria iOS client. Registers observer hooks that
  fan out pushes for approval requests, final assistant responses,
  long-task completion (>10 min), cron/routine completion, and @mentions in
  inbound gateway messages
  (including A2A agent-to-agent traffic), and mounts device-registration
  REST routes at /api/plugins/talaria-push/. A standalone sidecar mode
  (talaria-push-sidecar) adds gateway offline/recovered detection and
  approval request-id fidelity by watching the /api/ws surface.
author: "Talaria contributors"
kind: standalone
manifest_version: 2
license: MIT
tags: [push, apns, ios, notifications, talaria]
hooks:
  - pre_approval_request
  - post_approval_response
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - pre_gateway_dispatch
# Surfaced by `hermes plugins show` — hermes never auto-installs these.
# httpx and cryptography ship with hermes itself; h2 is the one extra
# wheel needed for httpx's HTTP/2 transport to APNs.
python_dependencies:
  - "h2>=4.1"
optional_env:
  - TALARIA_APNS_KEY_P8_PATH
  - TALARIA_APNS_KEY_ID
  - TALARIA_APNS_TEAM_ID
  - TALARIA_APNS_TOPIC
  - TALARIA_APNS_ENV
  - TALARIA_PUSH_EVENTS
  - TALARIA_PUSH_DISABLE
  - TALARIA_PUSH_LONG_TASK_MIN_S
  - TALARIA_PUSH_MENTION_HANDLES
  - TALARIA_PUSH_APPROVAL_SURFACES
  - TALARIA_PUSH_BOT_NAME
